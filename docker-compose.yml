services:
  boilmaster:
    image: ghcr.io/boringwolf/boilmaster:tc
    container_name: boilmaster
    restart: unless-stopped
    ports:
      - "8084:8080"
    volumes:
      - ./game:/app/game:ro
      - ./persist:/app/persist
    environment:
      - BM_GAME_DIRECTORY=/app/game
      - BM_READ_LANGUAGE_EXCLUDE=[chs,ko]
      - BM_READ_LANGUAGE_DEFAULT=tc
      - BM_SCHEMA_EXDSCHEMA_REMOTE=https://github.com/xivdev/EXDSchema.git
